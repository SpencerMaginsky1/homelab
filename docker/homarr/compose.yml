networks:
  homarr:
    driver_opts:
      com.docker.network.bridge.name: br-homarr   # fixed name so ufw can allow it to reach Kuma/Beszel

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    # Not host networking: Homarr runs internal services on 3000/3001/6379 that clash with dawarich/Kuma
    networks:
      - homarr
    ports:
      - '7575:7575'
    volumes:
      - ./appdata:/appdata
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}   # set in .env; keep it with appdata backups
      DOCKER_HOSTNAMES: docker-proxy                    # Docker Containers widget, via the read-only proxy below
      DOCKER_PORTS: '2375'
    depends_on:
      - docker-proxy
    restart: unless-stopped

  # Read-only Docker API for Homarr: list/inspect containers only, no start/stop/exec.
  # Not published on the host; only reachable on br-homarr.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    networks:
      - homarr
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    restart: unless-stopped
