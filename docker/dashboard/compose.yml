# Homelab dashboard (README 3.14). Reads Beszel, Uptime Kuma and the system journal read-only,
# and Docker through its own read-only proxy. Writes only to the Minecraft console bridge, the terminal bridge (a shell, behind its own password) and the Kasa light plugs.
networks:
  dashboard:
    driver_opts:
      com.docker.network.bridge.name: br-dashboard   # fixed name in case ufw rules are ever needed
  dockerapi:
    internal: true                                   # only the dashboard can reach the proxy; no internet

services:
  dashboard:
    build: .
    image: homelab-dashboard:local
    container_name: dashboard
    restart: unless-stopped
    networks: [dashboard, dockerapi]
    ports:
      - "7576:7576"          # published by Docker, so LAN + tailnet reach it without a ufw rule (router doesn't forward it)
    group_add: ["4"]         # adm: lets journalctl read /var/log/journal
    volumes:
      - ../beszel/beszel_data:/data/beszel:ro
      - ../uptime-kuma/data:/data/kuma:ro
      - /var/log/journal:/var/log/journal:ro
      - ./config.json:/app/config.json:ro   # links and shortcuts; edit, then `docker compose restart`
      - /home/spencer/Desktop/MineCraft Server:/data/minecraft:ro   # log, settings, ops/whitelist
      - ./run:/run/mc-console:ro            # bridge sockets: mc-console.sock + term.sock (console-bridge/, systemd user services)
    env_file: .env           # DASHBOARD_ / TERMINAL_ / CONSOLE_PASSWORD_HASH (set-password.sh), KASA_USERNAME, KASA_PASSWORD (owner-only file)
    environment:
      HOST_IP: 192.168.1.179
      MC_ADDRESS: example.duckdns.org
      WEATHER_LAT: "40.7479"           # Murray Hill, Manhattan
      WEATHER_LON: "-73.9757"
      WEATHER_NAME: Murray Hill, NYC
      TZ: America/New_York
      LOCK_IDLE_MINUTES: "10"          # lock screen comes back after this long with no mouse/keyboard/touch
      KASA_HOSTS: 192.168.1.184,192.168.1.185   # Desk Lamp, Couch Lamp (HS103); reserve these IPs in the router
    depends_on: [docker-proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7576/ping', timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Read-only Docker API: list/inspect containers, read logs, list images. No start/stop/exec (POST=0).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dashboard-docker-proxy
    networks: [dockerapi]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    restart: unless-stopped
