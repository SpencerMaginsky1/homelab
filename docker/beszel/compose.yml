services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    network_mode: host          # UI on :8090; access controlled by ufw
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host          # needed for real host network stats
    volumes:
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro   # per-container CPU/RAM
    environment:
      LISTEN: /beszel_socket/beszel.sock   # hub talks to agent over this socket; no TCP port opened
      KEY: ${BESZEL_KEY}                   # hub public key, set in .env
    restart: unless-stopped
