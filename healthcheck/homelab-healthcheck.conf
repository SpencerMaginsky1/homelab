# /etc/homelab-healthcheck.conf — settings for /usr/local/bin/homelab-healthcheck
# ntfy topic: anyone who knows this name can read/post to it, so keep it private.
NTFY_URL=https://ntfy.sh/CHANGE-ME   # real topic lives only in /etc/homelab-healthcheck.conf (installer never overwrites it)

EXPECTED_EXIT_IP=198.51.100.20   # Pi's WAN IP; update if its ISP changes it
HOME_WAN_IP=203.0.113.10         # seeing this means traffic is NOT using the exit node
PI_TS_IP=100.64.0.20
LAN_IF=enp2s0
LAN_GW=192.168.1.1
SYS_DISK=/dev/disk/by-id/ata-PNY_CS900_500GB_SSD_SERIAL123456
CLAUDE_USER=spencer
CLAUDE_BIN=/home/spencer/.local/bin/claude
README=/home/spencer/Desktop/Claud/README.md
DUCKDNS_HOST=example.duckdns.org
