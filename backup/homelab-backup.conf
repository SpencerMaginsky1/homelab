# /etc/homelab-backup.conf - settings for homelab-backup (README 3.18). Source: ~/Desktop/Claude/backup/
# install.sh copies this over the /etc copy each time, so edit it here and re-run the installer.

MOUNT=/mnt/storage
BUDGET_GB=100            # size budget for the server repo; oldest snapshots are dropped past it (with a push)

# What goes in. The databases and package lists are dumped to /var/lib/homelab-backup/staging first
# (added automatically). The Minecraft world is not here: it's copied from mc-backup's own repository.
PATHS=(
  /etc
  /usr/local/bin
  /usr/local/sbin
  /etc/systemd/system
  /var/lib/tailscale
  /var/spool/cron
  /home/spencer/Desktop/Claude
  /home/spencer/Desktop/docker
  /home/spencer/Desktop/GolfApp
  /home/spencer/Desktop/Shared
  /home/spencer/Desktop/hunt-export
  "/home/spencer/Desktop/MineCraft Server"
  /home/spencer/repos
  /home/spencer/bin
  /home/spencer/.ssh
  /home/spencer/.config
  /home/spencer/.claude
  /home/spencer/dawarich-backups
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server"
)

# What stays out: rebuildable caches, the live database folders (dumped instead), the Minecraft world
# (its own repo), and Plex's caches and thumbnails.
EXCLUDES=(
  /home/spencer/Desktop/docker/immich/postgres
  /home/spencer/Desktop/docker/_retired
  "/home/spencer/Desktop/MineCraft Server/world"
  "/home/spencer/Desktop/MineCraft Server/world.before-restore-*"
  "/home/spencer/Desktop/MineCraft Server/logs"
  "/home/spencer/Desktop/MineCraft Server/crash-reports"
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server/Cache"
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server/Media"
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server/Codecs"
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server/Crash Reports"
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server/Diagnostics"
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server/Logs"
  "/var/snap/plexmediaserver/common/Library/Application Support/Plex Media Server/Drivers"
  node_modules
  __pycache__
  .cache
)
